<!DOCTYPE html>
<html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Masuk</title>
<style>
:root{--bg:#0a0e19;--card:#111726;--line:#1e2638;--tx:#e6e9f0;--mu:#8590a6;--ac:#a3e635;--rd:#f87171;--inp:#0a0e19}
@media (prefers-color-scheme:light){:root{--bg:#f3f5f9;--card:#fff;--line:#e1e6ee;--tx:#182033;--mu:#667389;--ac:#4d7c0f;--rd:#dc2626;--inp:#fff}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.box{width:min(380px,100%);background:var(--card);border:1px solid var(--line);border-radius:14px;padding:26px;display:grid;gap:12px}
h2{margin:0;font-size:18px}
label{font-size:12px;color:var(--mu);font-weight:600;display:grid;gap:4px}
input{width:100%;background:var(--inp);color:var(--tx);border:1px solid var(--line);border-radius:8px;padding:11px 12px;font-size:15px}
input:focus-visible,button:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
button{background:var(--ac);color:#0a0e19;border:0;border-radius:8px;padding:11px;font-weight:700;font-size:15px;cursor:pointer}
button:disabled{opacity:.5}
#err{color:var(--rd);font-size:13px;min-height:18px;margin:0}
</style></head><body>
<div class="box">
<h2>Masuk</h2>
<label>Username<input id="u" autocomplete="username" autocapitalize="none" spellcheck="false"></label>
<label>PIN<input id="p" type="password" inputmode="numeric" autocomplete="current-password"></label>
<p id="err" role="alert"></p>
<button id="go">Masuk</button>
</div>
<script>
/* Server login utama = Apps Script dashboard CX (tab "User": A=Username, B=Pin, C=Role) */
const CX_URL='https://script.google.com/macros/s/AKfycbzVTbhsJ9ilUucZa9bDdRRX__N6na2KveCdb7LFHZFTHbq-M1Aqgm-_rNG3ccRwhtDjsg/exec',
 TOKEN='1T-JawA4dPNTrNmdwPBLI90oKRwpm7kL4cKgrTQHPaPw',SK='cxk-ses';
const HOME={admin:'cx.html',cs:'cx.html',crm:'cx.html',amalqu:'wakaf.html'};
const $=s=>document.querySelector(s);
const post=b=>fetch(CX_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:TOKEN,...b})}).then(r=>r.json());
const go=r=>location.replace(HOME[r]||'index.html');

/* Sesi tersimpan: verifikasi ke server, lalu langsung arahkan */
(async()=>{
 let s=null;try{s=JSON.parse(localStorage.getItem(SK)||'null')}catch(e){}
 if(!s||!s.s)return;
 try{const j=await(await fetch(CX_URL+'?action=whoami&token='+encodeURIComponent(TOKEN)+'&session='+encodeURIComponent(s.s))).json();
  if(j.ok){localStorage.setItem(SK,JSON.stringify({s:s.s,u:j.user,r:j.role}));go(j.role)}
  else localStorage.removeItem(SK)}catch(e){}
})();

async function login(){
 const u=$('#u').value.trim(),p=$('#p').value.trim(),b=$('#go'),er=$('#err');
 if(!u||!p){er.textContent='Isi username dan PIN';return}
 b.disabled=true;b.textContent='Memeriksa…';er.textContent='';
 try{const j=await post({action:'login',user:u,pin:p});
  if(!j.ok)throw new Error(j.error);
  if(!HOME[j.role])throw new Error('Role akun tidak dikenali');
  localStorage.setItem(SK,JSON.stringify({s:j.session,u:j.user,r:j.role}));go(j.role)}
 catch(e){er.textContent=e.message==='Failed to fetch'?'Tidak bisa terhubung ke server':e.message}
 finally{b.disabled=false;b.textContent='Masuk'}}
$('#go').onclick=login;
['#u','#p'].forEach(i=>$(i).addEventListener('keydown',e=>{if(e.key==='Enter')login()}));
</script></body></html>
